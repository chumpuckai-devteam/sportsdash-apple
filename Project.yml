name: SportsDash
options:
  bundleIdPrefix: com.sportsdash
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

# Hard IPTV engine = VLCKit via CocoaPods (MobileVLCKit / TVVLCKit) — LGPL.
# Soft path = native AVPlayer for clean HLS. KSPlayer removed (GPL).
# After clone: xcodegen generate && pod install && open SportsDash.xcworkspace
packages: {}

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "18"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: SportsDash
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    INFOPLIST_KEY_CFBundleIconName: AppIcon
    INFOPLIST_KEY_UILaunchScreen_UIColorName: LaunchBackground
    INFOPLIST_KEY_UILaunchScreen_UIImageName: AppLogo
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
    INFOPLIST_KEY_UIBackgroundModes: "audio"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "2H57Y8GR9D"
    # Required for CocoaPods embed of large VLC frameworks
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    DEAD_CODE_STRIPPING: YES

targets:
  SportsDash:
    type: application
    platform: iOS
    sources:
      - path: SportsDash
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samirpatel.sportsdash.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "2H57Y8GR9D"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: "$(inherited) -ObjC"
    scheme:
      testTargets: []

  SportsDashTV:
    type: application
    platform: tvOS
    sources:
      - path: SportsDash
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samirpatel.sportsdash.tvos
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "2H57Y8GR9D"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: "$(inherited) -ObjC"
    scheme:
      testTargets: []

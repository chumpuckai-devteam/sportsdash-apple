name: iOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XCODE_APP=""
          for candidate in \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode_26.1.1.app \
            /Applications/Xcode_26.1.app \
            /Applications/Xcode_26.0.1.app \
            /Applications/Xcode_26.0.app \
            /Applications/Xcode_26.app
          do
            if [ -d "$candidate" ]; then
              XCODE_APP="$candidate"
              break
            fi
          done
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode 26+ found; using default Xcode"
            XCODE_APP=/Applications/Xcode.app
          fi
          sudo xcode-select -s "$XCODE_APP"
          echo "Using $(xcode-select -p)"
          xcodebuild -version
      - name: Generate project + CocoaPods (VLCKit)
        run: |
          brew install xcodegen cocoapods
          xcodegen generate
          pod install --repo-update
      - name: Build iOS (workspace)
        run: |
          xcodebuild \
            -workspace SportsDash.xcworkspace \
            -scheme SportsDash \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build

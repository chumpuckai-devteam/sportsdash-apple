    .grid { background-image: radial-gradient(#181818 1px, transparent 1px); background-size: 6px 6px; }
    .btn { height:36px; padding:0 14px; display:flex; align-items:center; gap:8px; font-family:"Bebas Neue", Impact, sans-serif; font-size:18px; letter-spacing:0.08em; }
